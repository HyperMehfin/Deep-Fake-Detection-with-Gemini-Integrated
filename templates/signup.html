<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TrueVision</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #e2e8f0;
        }
        .signup-container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #ffffff;
        }
        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        .input-group {
            position: relative;
        }
        .input-group i.fa-solid:not(.toggle-password) {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        /* Eye Icon Styling */
        .input-group i.toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.3s;
        }
        .input-group i.toggle-password:hover {
            color: #ffffff;
        }
        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 40px; /* Padding for both left and right icons */
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #5eead4;
        }
        
        /* Dynamic Strength Bar Styling */
        .strength-meter {
            height: 4px;
            background-color: #334155;
            margin-top: 8px;
            border-radius: 2px;
            overflow: hidden;
        }
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
        }
        .strength-text {
            font-size: 12px;
            margin-top: 5px;
            font-weight: bold;
            min-height: 15px; /* Keeps layout from jumping */
        }

        /* Password Hint Text Styling */
        .password-hint {
            color: #8b9eb0; 
            font-size: 12px; 
            margin-top: 10px; 
            margin-bottom: 0px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #5eead4;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #2dd4bf;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }
        .login-link a {
            color: #5eead4;
            text-decoration: none;
            font-weight: bold;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="signup-container">
    <h2>Create Account</h2>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/signup" id="signupForm">
        <div class="form-group">
            <label>Username</label>
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" id="password" placeholder="••••••" required>
                <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
            </div>
            
            <div class="strength-meter">
                <div class="strength-bar" id="strengthBar"></div>
            </div>
            <div class="strength-text" id="strengthText"></div>

            <p class="password-hint"><i class="fas fa-info-circle"></i> Password must be at least 6 characters long and include a number.</p>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="confirm_password" placeholder="Confirm your password" required>
            </div>
        </div>

        <button type="submit" class="btn-submit">Sign Up</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="/login">Login</a>
    </div>
</div>

<script>
    // Toggle Password Visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    // Dynamic Password Strength Logic
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    passwordInput.addEventListener('input', function() {
        const val = passwordInput.value;
        let strength = 0;

        // Add points for complexity
        if (val.length >= 6) strength += 1;
        if (val.match(/\d/)) strength += 1;
        if (val.match(/[A-Z]/)) strength += 1;
        if (val.match(/[!@#$%^&*(),.?":{}|<>]/)) strength += 1;
        if (val.length >= 10) strength += 1;

        if (val.length === 0) {
            strengthBar.style.width = '0%';
            strengthText.textContent = '';
        } 
        // Force 'Weak' if it doesn't meet the absolute minimum backend requirements
        else if (val.length < 6 || !val.match(/\d/) || strength <= 2) {
            strengthBar.style.width = '33%';
            strengthBar.style.backgroundColor = '#ef4444'; // Red
            strengthText.textContent = 'Weak password';
            strengthText.style.color = '#ef4444';
        } 
        else if (strength >= 3 && strength < 5) {
            strengthBar.style.width = '66%';
            strengthBar.style.backgroundColor = '#f97316'; // Orange
            strengthText.textContent = 'Medium password';
            strengthText.style.color = '#f97316';
        } 
        else {
            strengthBar.style.width = '100%';
            strengthBar.style.backgroundColor = '#22c55e'; // Green
            strengthText.textContent = 'Strong password';
            strengthText.style.color = '#22c55e';
        }
    });
</script>

</body>
</html>
